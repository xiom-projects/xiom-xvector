# XIOM XVECTOR -- compiler project manifest (xiom.toml is the canonical
# project manifest; package.xi remains the registry/pkg manifest).
#
# C-PULSE-02 UPDATE (2026-10-10, compiler v0.64.2): the dependency-root
# resolver DOES read [dependencies] and adds installed package roots from
# $XIOM_HOME/packages to the catalog (the legacy package.xi `deps:` block
# is not consumed for source roots). xvector consumes `xiom.wal` -- the
# single WAL home -- for record-shape alignment (see
# docs/XIOM-WAL-ADOPTION.md); the lane's own durability codec stays until
# the migration slices land. `xiom.metrics` 0.2.0 backs the
# observability.metrics internals (see docs/XIOM-METRICS-ADOPTION.md) and
# `xiom.rate` 0.2.0 backs the S3 token-bucket RateLimiter (see
# docs/XIOM-RATE-ADOPTION.md).
[project]
name = "xiom.xvector"
version = "1.0.0-rc.1"
root = "src"
source-roots = [
  "src",
]

[dependencies]
xiom.wal = "0.1.0"
xiom.metrics = "0.2.0"
xiom.rate = "0.2.0"
# Latest-tree protocol (owner directive 2026-10-17): bump to the newest
# registry version each pass; 0.1.8 is live (hook + version seams).
xiom.http = "0.1.9"
xiom.vectors = "0.1.0"
# Embedded/lite tier products (new names, live 2026-10-17): ORBITDB
# Satellite (embedded engine, zero registry deps) and PULSE Beacon (the
# embeddable protocol core). Consumption gates: probe_package_orbitdb /
# probe_package_pulse.
xiom.orbitdb = "0.2.1"
xiom.pulse = "0.2.1"
